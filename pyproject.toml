[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "avd-client"
version = "0.2.0"
description = "Native Linux client for Azure Virtual Desktop"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "dbus-python>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "pytest-cov>=4", "pytest-mock>=3"]
dev = ["ruff~=0.8.0", "build"]

[project.scripts]
avd-client = "avd_client.__main__:main"
avd-client-protocol-handler = "avd_client.protocol_handler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avd_client = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["avd_client"]
branch = true

[tool.coverage.report]
fail_under = 99
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__", "raise NotImplementedError", "if TYPE_CHECKING"]
